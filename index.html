<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CFE0F2">
<title>Mellow Meow｜下班後的工作手帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈‍⬛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   色彩：晴空（淺色）／傍晚（深色）
   ========================================================= */
:root{
  --bg1:#E4EEF8; --bg2:#C4D8EE; --bg3:#F7EBDD;
  --surface:rgba(255,255,255,.86); --surface-solid:#FFFFFF; --surface-2:#F3F7FB; --surface-3:#E9F0F8;
  --ink:#1D2333; --ink-2:#556079; --ink-3:#8A93A8; --line:#E2E8F1;
  --sky:#6A94C4; --sky-deep:#3E6696; --accent:#F2A33A; --accent-soft:#FFF0D9; --accent-ink:#7A4A0B;
  --cat:#1C1C22; --cream:#F4EEE3; --ok:#5FAE8B;
  --shadow-1:0 1px 2px rgba(29,35,51,.05), 0 6px 18px -8px rgba(62,102,150,.22);
  --shadow-2:0 2px 6px rgba(29,35,51,.05), 0 24px 48px -20px rgba(62,102,150,.38);
  --shadow-frame:0 40px 80px -30px rgba(62,102,150,.45);
  --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:10px;
  --font:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --script:"Great Vibes",cursive;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg1:#121A2B; --bg2:#1A2742; --bg3:#2A2238;
  --surface:rgba(28,36,54,.86); --surface-solid:#1C2436; --surface-2:#232D44; --surface-3:#2A3651;
  --ink:#EEF1F7; --ink-2:#AEB7CB; --ink-3:#7C86A0; --line:#2F3A55;
  --sky:#8FB0D6; --sky-deep:#A9C3E4; --accent:#F5B04F; --accent-soft:#3A3021; --accent-ink:#FFD99A;
  --cat:#0D0D12; --cream:#F4EEE3; --ok:#7CC6A4;
  --shadow-1:0 6px 18px -8px rgba(0,0,0,.6);
  --shadow-2:0 24px 48px -20px rgba(0,0,0,.75);
  --shadow-frame:0 40px 80px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 85% -10%,var(--bg3),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;transition:background .5s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sky-deep)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =========================================================
   背景立體層（滑鼠視差）
   ========================================================= */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.layer{position:absolute;will-change:transform;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.cloud3d{width:var(--w,180px);height:calc(var(--w,180px)*.45);border-radius:999px;
  background:radial-gradient(60% 90% at 35% 30%,#fff,#E8F0FA 60%,#CCDCEF);box-shadow:inset -10px -14px 24px rgba(106,148,196,.25),0 30px 50px -20px rgba(62,102,150,.35);opacity:.95}
.cloud3d::before,.cloud3d::after{content:"";position:absolute;border-radius:50%;background:inherit;box-shadow:inherit}
.cloud3d::before{width:48%;height:105%;left:16%;top:-48%}
.cloud3d::after{width:36%;height:80%;left:50%;top:-30%}
:root[data-theme="dark"] .cloud3d{background:radial-gradient(60% 90% at 35% 30%,#4A5B7E,#2E3B58 60%,#222C44);box-shadow:inset -10px -14px 24px rgba(0,0,0,.35),0 30px 50px -20px rgba(0,0,0,.6);opacity:.8}
.vinyl{width:120px;height:120px;border-radius:50%;background:repeating-radial-gradient(circle,#26262E 0 2px,#1C1C22 2px 4px);box-shadow:0 30px 40px -18px rgba(29,35,51,.5)}
.vinyl::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,#1C1C22 12%,var(--accent) 14%)}
.orb{width:var(--w,70px);height:var(--w,70px);border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff6e3,var(--accent) 55%,#C9781A);box-shadow:0 24px 40px -16px rgba(201,120,26,.55)}
.star{width:34px;height:34px;background:var(--cream);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .float{animation:float 9s ease-in-out infinite}
  .float.b{animation-duration:12s;animation-delay:-3s}
  .spin{animation:spin 14s linear infinite}
}
@keyframes float{50%{translate:0 -14px}}
@keyframes spin{to{rotate:360deg}}

/* =========================================================
   App 外框
   ========================================================= */
.app{position:relative;z-index:1}
@media (min-width:960px){
  .app{max-width:1280px;margin:28px auto;min-height:calc(100vh - 56px);display:grid;grid-template-columns:248px 1fr;
    background:var(--surface);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
    border-radius:var(--r-xl);box-shadow:var(--shadow-frame);border:1px solid rgba(255,255,255,.5)}
  :root[data-theme="dark"] .app{border-color:rgba(255,255,255,.06)}
}
@media (min-width:960px) and (max-width:1340px){.app{margin:20px 20px}}

/* 側邊欄（桌機） */
.side{display:none}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;padding:28px 18px 22px;border-right:1px solid var(--line);position:sticky;top:0;height:calc(100vh - 56px);max-height:900px}
}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.logo svg{width:40px;height:40px;flex:none}
.logo b{font-family:var(--script);font-weight:400;font-size:27px;line-height:1;white-space:nowrap}
.logo{min-width:0}
.snav{display:flex;flex-direction:column;gap:4px;position:relative}
.snav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;color:var(--ink-2);text-decoration:none;font-weight:600;transition:color .2s}
.snav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.snav a:hover{color:var(--ink)}
.snav a:hover svg{transform:translateY(-2px) rotate(-6deg)}
.snav a[aria-current="page"]{color:var(--ink)}
.snav .pill{position:absolute;left:0;right:0;height:46px;border-radius:14px;background:var(--accent-soft);transition:transform .45s cubic-bezier(.3,1.3,.4,1);z-index:0}
.snav a .count{margin-left:auto;font-size:12.5px;background:var(--surface-3);color:var(--ink-2);border-radius:99px;padding:0 8px;font-weight:700}
.side-cat{margin-top:auto;position:relative;background:var(--cat);color:#fff;border-radius:var(--r-lg);padding:62px 16px 16px;text-align:left;border:0;width:100%;overflow:visible;box-shadow:var(--shadow-2);transition:transform .3s}
.side-cat:hover{transform:translateY(-3px)}
.side-cat .mini{position:absolute;left:50%;top:-38px;width:96px;transform:translateX(-50%)}
.side-cat strong{display:block;font-size:15px}
.side-cat span{display:block;font-size:13px;opacity:.75;line-height:1.5}

/* 主內容 */
.main{min-width:0;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){.main{padding:26px 34px 40px}}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 2px 6px}
.topbar .hello{flex:1;min-width:0}
.topbar .hello small{display:block;color:var(--ink-3);font-size:13.5px;font-weight:600}
.topbar .hello h1{margin:0;font-size:22px;line-height:1.35;font-weight:800}
.mlogo{font-family:var(--script);font-weight:400;font-size:28px;line-height:1}
@media (min-width:960px){.mlogo{display:none}}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface-solid);display:grid;place-items:center;box-shadow:var(--shadow-1);transition:transform .2s}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 主題切換 */
.theme{width:72px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface-3);position:relative;padding:0;flex:none}
.theme i{position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,163,58,.18);transition:transform .45s cubic-bezier(.3,1.4,.4,1),background .4s}
:root[data-theme="dark"] .theme i{transform:translateX(32px);background:var(--cream);box-shadow:inset -8px -3px 0 #C9C2B4}
.theme span{position:absolute;top:50%;transform:translateY(-50%);font-size:13px}
.theme .s{right:10px}.theme .m{left:11px}

/* 頁面切換 */
.view{animation:viewIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.3;transform:translateY(8px)}}
.page-title{margin:18px 2px 4px;font-size:26px;font-weight:800;line-height:1.3}
.page-sub{margin:0 2px 18px;color:var(--ink-2)}

/* =========================================================
   卡片
   ========================================================= */
.card{position:relative;background:var(--surface-solid);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:22px;border:1px solid var(--line);
  transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
@media (hover:hover) and (pointer:fine){ .tilt:hover{box-shadow:var(--shadow-2)} }
.card h3{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.45}
.label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.label i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.muted{color:var(--ink-2)}
.grid{display:grid;gap:16px}
@media (min-width:960px){
  .grid.home{grid-template-columns:repeat(12,1fr);gap:20px}
  .span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
}

/* hero：貓咪破版 */
.hero{display:grid;grid-template-columns:1fr;gap:6px;padding:26px 22px 22px;margin-top:64px;background:linear-gradient(135deg,#7FA6D2,#5B86BA);color:#fff;border:0;overflow:visible}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#2D4468,#1F3150)}
.hero .label{color:rgba(255,255,255,.8)}
.hero .label i{background:var(--cream)}
.hero .big{font-size:30px;font-weight:800;line-height:1.3;margin:2px 0 0;max-width:12em}
.hero .big b{font-size:46px;color:#FFE0A6;padding:0 4px;display:inline-block}
.hero .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);margin:16px 0 8px;overflow:hidden;max-width:420px}
.hero .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFE0A6,var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hero small{opacity:.85}
.hero .catwrap{position:absolute;right:18px;top:-74px;width:150px;height:170px;cursor:pointer;transform:translateZ(40px)}
.hero .sill{position:absolute;left:0;right:0;bottom:0;height:16px;border-radius:0 0 var(--r-lg) var(--r-lg);background:rgba(255,255,255,.18)}
.hero .text{padding-right:130px}
@media (min-width:960px){.hero{margin-top:70px;padding:34px 34px 30px}.hero .catwrap{width:200px;height:226px;top:-96px;right:40px}.hero .text{padding-right:240px}}
.bubble{position:absolute;right:calc(100% - 6px);top:30px;background:var(--surface-solid);color:var(--ink);font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:14px 14px 4px 14px;white-space:nowrap;box-shadow:var(--shadow-2);opacity:0;transform:translateY(6px) scale(.9);transform-origin:right bottom;transition:all .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.bubble.show{opacity:1;transform:none}

/* 下一件（強調卡） */
.next{background:var(--accent);border:0;color:#2A1A04}
:root[data-theme="dark"] .next{background:linear-gradient(140deg,#F5B04F,#E48F2A)}
.next .label{color:rgba(42,26,4,.7)}.next .label i{background:#2A1A04}
.next h3{font-size:20px}
.next p{margin:4px 0 14px;color:rgba(42,26,4,.75);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:9px 18px;font-weight:700;background:var(--ink);color:var(--surface-solid);transition:transform .2s,box-shadow .2s;text-decoration:none;font-size:15px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.btn:active{transform:scale(.96)}
.btn.light{background:rgba(255,255,255,.65);color:#2A1A04}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 14px;font-size:14px}
.btn.accent{background:var(--accent);color:#2A1A04}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 倒數（黑膠卡） */
.count{background:var(--cat);color:#fff;border:0;overflow:hidden}
.count .label{color:rgba(255,255,255,.65)}
.count .n{font-size:64px;line-height:1;font-weight:800;color:#FFE0A6}
.count .disc{position:absolute;right:-46px;bottom:-46px;width:170px;height:170px;border-radius:50%;background:repeating-radial-gradient(circle,#2B2B33 0 2px,#202027 2px 4px);transition:transform .8s}
.count .disc::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,#1C1C22 12%,var(--accent) 14%)}
.count:hover .disc{transform:rotate(200deg)}
.count p{margin:6px 0 14px;opacity:.8;font-size:14.5px;position:relative}
.count .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}

.pbar{display:grid;grid-template-columns:7.5em 1fr 2.6em;gap:10px;align-items:center;font-size:14.5px;margin:9px 0}
.pbar .t{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.pbar .t i{display:block;height:100%;border-radius:99px;background:var(--sky);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pbar span:last-child{text-align:right;color:var(--ink-3);font-weight:700}
.rules{display:grid;gap:12px}
@media (min-width:700px){.rules{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.rules{grid-template-columns:repeat(3,1fr)}}
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r-md);padding:14px;font-size:15px;line-height:1.65}
.rule b{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.npreview{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;margin-top:8px;font-size:15px;white-space:pre-wrap;word-break:break-word}

/* =========================================================
   待辦：清單＋詳情
   ========================================================= */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface-solid);border-radius:99px;padding:6px 16px;white-space:nowrap;font-weight:700;color:var(--ink-2);transition:all .25s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface-solid);border-color:var(--ink)}
.tasks-wrap{display:grid;gap:18px}
@media (min-width:1080px){.tasks-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}}
.phase{margin-bottom:16px}
.phase-h{display:flex;align-items:baseline;gap:10px;margin:6px 4px 8px}
.phase-h h3{margin:0;font-size:17px;font-weight:800}
.phase-h small{color:var(--ink-3);font-weight:600}
.phase-h .pc{margin-left:auto;font-size:13px;font-weight:800;color:var(--sky-deep)}
.tlist{background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow-1)}
.titem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;transition:background .2s,transform .2s;cursor:pointer}
.titem:hover{background:var(--surface-2)}
.titem.sel{background:var(--accent-soft)}
.titem .tt{flex:1;min-width:0;font-weight:600;line-height:1.5}
.titem.done .tt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.titem .tag{flex:none}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.note{background:var(--accent-soft);color:var(--accent-ink)}
.check{flex:none;position:relative;width:28px;height:28px;border-radius:10px;border:2px solid var(--ink-3);background:transparent;padding:0;display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.check svg{width:17px;height:17px;stroke:#2A1A04;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s ease .05s}
.done .check,.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);transform:rotate(-6deg)}
.done .check svg,.check[aria-pressed="true"] svg{stroke-dashoffset:0}
.check:hover{transform:scale(1.08)}
.addrow{display:flex;gap:8px;padding:6px}
.addrow input{flex:1;min-width:0;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:7px 12px}
.detail{position:sticky;top:20px}
.detail .card{padding:26px}
.detail h2{margin:4px 0 8px;font-size:22px;line-height:1.45;font-weight:800}
.steps{counter-reset:s;list-style:none;margin:14px 0;padding:0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 42px;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:9px;background:var(--surface-3);color:var(--sky-deep);font-weight:800;display:grid;place-items:center;font-size:14px}
.ruled{width:100%;min-height:150px;border:1px solid var(--line);border-radius:var(--r-md);padding:4px 16px;line-height:32px;resize:vertical;
  background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px),var(--surface-2);background-attachment:local}
.saved{font-size:13px;color:var(--ink-3);min-height:20px}
.emptyd{text-align:center;padding:40px 10px;color:var(--ink-2)}
.emptyd svg{width:140px;height:150px}

/* =========================================================
   發布：筆記本雙頁
   ========================================================= */
.book{position:relative;display:grid;gap:0;background:var(--surface-2);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow-2);border:2px solid color-mix(in srgb,var(--sky) 45%,transparent)}
@media (min-width:1080px){.book{grid-template-columns:1fr 1fr}}
.pagecard{background:var(--surface-solid);border-radius:18px;padding:26px 24px;border:1px solid var(--line);min-width:0}
@media (min-width:1080px){.pagecard:first-child{margin-right:10px}.pagecard:last-child{margin-left:10px}}
.rings{display:none}
@media (min-width:1080px){
  .rings{display:flex;flex-direction:column;gap:150px;position:absolute;left:50%;top:70px;bottom:40px;overflow:hidden;transform:translateX(-50%);z-index:2}
  .rings i{width:30px;height:16px;border:3px solid var(--ink-2);border-radius:99px;background:var(--surface-2)}
}
.stickyside{position:sticky;top:24px}
.polaroid{margin:22px auto 0;width:min(260px,100%);background:#fff;padding:10px 10px 14px;border-radius:6px;box-shadow:var(--shadow-2);transform:rotate(-2.5deg);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.polaroid:hover{transform:rotate(0) translateY(-4px)}
.polaroid .ph{position:relative;aspect-ratio:1/1;border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#8FB3DD,#C9DCF0 70%,#F4EEE3 70%)}
.polaroid .ph .catsvg{position:absolute;width:62%;height:auto;left:19%;bottom:6%}
.polaroid p{margin:10px 0 0;text-align:center;color:#55505C;font-size:14px}
.songtitle{font-family:var(--script);font-weight:400;font-size:64px;line-height:1;margin:6px 0 2px}
.wave{display:flex;align-items:flex-end;gap:3px;height:28px;margin:10px 0 4px}
.wave i{width:4px;border-radius:2px;background:var(--sky);height:30%}
@media (prefers-reduced-motion:no-preference){.wave i{animation:eq 1.2s ease-in-out infinite}}
@keyframes eq{50%{height:100%}}
.tl{list-style:none;margin:18px 0 0;padding:0}
.tl>li{position:relative;padding:0 0 22px 34px}
.tl>li::before{content:"";position:absolute;left:10px;top:12px;bottom:0;border-left:2px dashed var(--line)}
.tl>li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:4px;width:22px;height:22px;border-radius:50%;background:var(--surface-solid);border:5px solid var(--sky)}
.tl h4{margin:0 0 6px;font-size:16px}
.mini{display:flex;align-items:center;gap:10px;padding:6px 0}
.mini .check{width:24px;height:24px;border-radius:8px}
.mini.done .what{color:var(--ink-3);text-decoration:line-through}
.plat{font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;color:#fff;flex:none}
.plat.YT{background:#D45A50}.plat.IG{background:#C2668F}.plat.p916{background:var(--ink-2)}
.cblock{padding:14px 0;border-bottom:1px dashed var(--line)}
.cblock:last-child{border-bottom:0}
.cb-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cb-h strong{font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0}
pre.ct{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:15px;line-height:1.8;background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:10px 0 0;position:relative;overflow:hidden;transition:max-height .4s}
pre.ct.clamp{max-height:10.5em}
pre.ct.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.5em;background:linear-gradient(transparent,var(--surface-2))}
.linkbtn{background:none;border:0;color:var(--sky-deep);font-weight:700;padding:6px 0;font-size:14px}
.copy.ok{background:var(--ok);color:#fff}
.formula{counter-reset:f;list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:800px){.formula{grid-template-columns:repeat(2,1fr)}}
.formula li{counter-increment:f;display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.formula li::before{content:counter(f);flex:none;width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--surface-solid);display:grid;place-items:center;font-weight:800;font-size:14px}

/* =========================================================
   品牌
   ========================================================= */
.masonry{columns:1;column-gap:18px}
@media (min-width:800px){.masonry{columns:2}}
.masonry>.card{break-inside:avoid;margin-bottom:18px;display:block}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.dd ul{margin:6px 0 0;padding-left:1.1em;font-size:15px}
.dd h4{margin:0;font-size:14px;color:var(--ink-3)}
.quote{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:8px 14px;margin:8px 0 0;font-weight:600}
.qlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qlist button{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:6px 12px;font-size:14.5px;text-align:left;transition:transform .2s,background .2s}
.qlist button:hover{transform:translateY(-2px);background:var(--accent-soft)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:10px}
.sw button{border:0;padding:0;background:none;text-align:left;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw button:hover{transform:translateY(-6px) rotate(-3deg)}
.sw i{display:block;height:74px;border-radius:16px;box-shadow:var(--shadow-1);border:1px solid var(--line)}
.sw span{display:block;font-size:13.5px;margin-top:6px;font-weight:700}
.sw small{color:var(--ink-3);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
td{padding:9px 4px;border-top:1px dashed var(--line);vertical-align:top}
td:first-child{white-space:nowrap;padding-right:12px;font-weight:700}
@media (max-width:520px){.dd{grid-template-columns:1fr}td:first-child{white-space:normal}}

/* =========================================================
   筆記：手帳＋便利貼
   ========================================================= */
.composer{display:grid;gap:12px}
.composer textarea{min-height:120px}
.attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.attach input[type=url]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:8px 12px}
.preview-img{position:relative;width:120px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-1)}
.preview-img img{display:block;width:100%}
.preview-img button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;line-height:1}
.board{columns:1;column-gap:18px;margin-top:22px}
@media (min-width:640px){.board{columns:2}}
@media (min-width:1100px){.board{columns:3}}
.sticky{break-inside:avoid;margin:0 0 18px;display:block;position:relative;border-radius:6px 6px 18px 6px;padding:16px 16px 12px;color:#2A2A33;box-shadow:0 2px 4px rgba(0,0,0,.06),0 18px 30px -18px rgba(29,35,51,.45);
  transform:rotate(var(--rot,0deg));transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s;background:#FFF2C4}
.sticky:nth-child(4n+2){background:#DDEAF7;--rot:.8deg}
.sticky:nth-child(4n+3){background:#F7E1D6;--rot:-.6deg}
.sticky:nth-child(4n){background:#E3F0E2;--rot:.5deg}
.sticky:nth-child(4n+1){--rot:-.8deg}
.sticky:hover{transform:rotate(0) translateY(-4px) scale(1.01);box-shadow:0 30px 40px -20px rgba(29,35,51,.5)}
.sticky::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sticky .img{margin:0 0 10px;border-radius:6px;overflow:hidden;background:#fff;padding:6px 6px 18px;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(-1.5deg)}
.sticky .img img{display:block;width:100%;border-radius:2px}
.sticky p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.75}
.sticky p a{color:#2F5E92;font-weight:700}
.sticky .lk{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.65);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:700;color:#2F5E92;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:#6B6573}
.sticky footer button{background:none;border:0;color:#5B5563;padding:2px 6px;font-weight:700}
.sticky textarea,.sticky input{width:100%;border:0;background:rgba(255,255,255,.6);border-radius:8px;padding:8px;color:#2A2A33;margin-bottom:6px}
.empty{text-align:center;color:var(--ink-2);padding:30px 0}

/* =========================================================
   行動版底部導覽
   ========================================================= */
.mtabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-2);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.mtabs a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0 4px;color:var(--ink-3);text-decoration:none;font-size:11.5px;font-weight:700;border-radius:18px;transition:color .2s}
.mtabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.mtabs a[aria-current="page"]{color:var(--ink)}
.mtabs a[aria-current="page"] svg{transform:translateY(-2px)}
.mtabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:18px;background:var(--accent-soft);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
@media (min-width:960px){.mtabs{display:none}}

/* 黑貓按鈕（行動版問 Claude） */
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:21;width:62px;height:62px;border-radius:22px;border:0;background:var(--cat);box-shadow:var(--shadow-2);padding:0;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.fab:active{transform:scale(.92)}
.fab svg{width:50px;height:50px}
@media (min-width:960px){.fab{display:none}}

/* =========================================================
   抽屜（對話／設定／任務詳情）
   ========================================================= */
.scrim{position:fixed;inset:0;background:rgba(15,20,32,.42);backdrop-filter:blur(3px);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:31;background:var(--surface-solid);display:flex;flex-direction:column;visibility:hidden;
  left:0;right:0;bottom:0;height:min(88vh,780px);border-radius:28px 28px 0 0;transform:translateY(105%);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s linear .4s;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow-frame)}
.drawer.show{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s}
@media (min-width:960px){
  .drawer{left:auto;top:20px;bottom:20px;right:20px;width:440px;height:auto;border-radius:28px;transform:translateX(110%)}
}
.drawer header{display:flex;align-items:center;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:18px;flex:1}
.drawer .grab{position:absolute;top:7px;left:50%;width:42px;height:5px;border-radius:99px;background:var(--line);transform:translateX(-50%)}
@media (min-width:960px){.drawer .grab{display:none}}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:12px;font-size:20px;line-height:1}
.dbody{flex:1;overflow:auto;padding:16px 20px}
.msg{width:fit-content;max-width:88%;margin:0 0 12px;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.msg.user{margin-left:auto;background:var(--sky-deep);color:#fff;border-bottom-right-radius:6px}
:root[data-theme="dark"] .msg.user{background:#3E6696}
.msg.ai{background:var(--surface-2);border-bottom-left-radius:6px}
.msg.err{background:#F8DCD6;color:#7A2E22}
.acts{margin-top:10px;padding:10px 12px;border:1.5px dashed var(--sky);border-radius:14px;background:var(--surface-solid);white-space:normal}
.acts ul{margin:4px 0 8px;padding-left:1.2em}
.dfoot{border-top:1px solid var(--line);padding:10px 14px 12px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 13px;font-size:13.5px;font-weight:600}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;min-height:46px;max-height:140px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:10px 14px;resize:none}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:9px 12px}
.warn{font-size:14px;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin:8px 0}
hr.soft{border:0;border-top:1px dashed var(--line);margin:18px 0}

/* 完成時的小雲朵 */
.burst{position:fixed;pointer-events:none;z-index:60;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--surface-solid);padding:9px 20px;border-radius:999px;z-index:70;transition:all .3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;font-size:14.5px;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:40px}}

/* =========================================================
   黑貓角色
   ========================================================= */
.catsvg{width:100%;height:100%;overflow:visible}
.catsvg .head{transform-origin:100px 118px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.catsvg .tail{transform-origin:150px 214px}
@media (prefers-reduced-motion:no-preference){
  .catsvg .tail{animation:swish 3.2s ease-in-out infinite}
  .catsvg .phones{animation:bob 1.6s ease-in-out infinite}
  .catsvg.happy{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes hop{40%{transform:translateY(-12px)}}
.catsvg .open{opacity:0;transition:opacity .2s}
.catsvg .closed{transition:opacity .2s}
.catsvg.awake .open{opacity:1}
.catsvg.awake .closed{opacity:0}
.catsvg.happy .open{opacity:0}
.catsvg.happy .closed{opacity:0}
.catsvg .smile{opacity:0}
.catsvg.happy .smile{opacity:1}
.catsvg .pupil{transition:transform .15s}

:root[data-theme="dark"] .catsvg{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.35)) drop-shadow(0 12px 18px rgba(0,0,0,.45))}
:root[data-theme="dark"] .sticky{filter:brightness(.93)}
.hero .br{display:block}
@media (min-width:960px){.hero .br{display:inline}}
@media (max-width:959px){.scene{opacity:.5}.hero .big{font-size:26px}.hero .big b{font-size:40px}}
#taskDrawerBody .card{border:0;box-shadow:none;padding:2px 0;background:transparent}

/* =========================================================
   動態 v2.1：逐字浮現／卡片展開／共享元素轉場／翻開筆記本
   ========================================================= */
.reveal .ch{display:inline-block;white-space:pre}
@media (prefers-reduced-motion:no-preference){
  .reveal .ch{opacity:0;filter:blur(6px);transform:translateY(.25em);animation:rv .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*32ms)}
}
@keyframes rv{to{opacity:1;filter:none;transform:none}}

/* 這首歌的四則發文：疊起來 → 展開 */
.deck{position:relative;height:232px;margin:22px 0 4px;--gap:106px}
@media (max-width:520px){.deck{--gap:76px;height:206px}}
.dcard{position:absolute;left:50%;top:18px;width:100px;border-radius:16px;background:var(--surface-solid);box-shadow:var(--shadow-2);border:1px solid var(--line);padding:8px 8px 10px;
  transform:translateX(calc(-50% + var(--sx))) rotate(var(--sr));transition:transform .7s cubic-bezier(.3,1.25,.4,1),box-shadow .3s;z-index:var(--z)}
@media (max-width:520px){.dcard{width:82px;padding:6px 6px 8px}.dcard .thumb{height:84px}.dcard .cap{font-size:12px}}
.deck.fan .dcard{transform:translateX(calc(-50% + var(--fx))) translateY(var(--fy)) rotate(var(--fr));transition-delay:calc(var(--k)*70ms)}
@media (hover:hover){.deck.fan .dcard:hover{transform:translateX(calc(-50% + var(--fx))) translateY(calc(var(--fy) - 14px)) rotate(0);z-index:9;box-shadow:var(--shadow-frame);transition-delay:0s}}
.dcard .thumb{height:100px;border-radius:11px;background:linear-gradient(165deg,#8FB3DD,#CFE0F2 72%,#F4EEE3 72%);display:grid;place-items:center;overflow:hidden;position:relative}
:root[data-theme="dark"] .dcard .thumb{background:linear-gradient(165deg,#3A5479,#5B7BA6 72%,#3A3446 72%)}
.dcard .frame{background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.85);border-radius:6px;display:grid;place-items:center}
.dcard .frame svg{width:60%;height:auto}
.dcard .f169{width:84%;aspect-ratio:16/9}
.dcard .f916{height:86%;aspect-ratio:9/16}
.dcard .f45{height:74%;aspect-ratio:4/5;box-shadow:6px -6px 0 -2px rgba(255,255,255,.55),12px -12px 0 -4px rgba(255,255,255,.35)}
.dcard .cap{display:block;font-size:12.5px;font-weight:700;line-height:1.4;margin-top:7px}
.dcard .when{display:block;font-size:11.5px;color:var(--ink-3);font-weight:700}
.dcard .chipx{position:absolute;top:-12px;right:-8px;font-size:11.5px;font-weight:800;color:#fff;border-radius:99px;padding:2px 9px;box-shadow:var(--shadow-1);opacity:0;transform:scale(.5) rotate(-10deg);transition:all .45s cubic-bezier(.3,1.6,.5,1)}
.deck.fan .dcard .chipx{opacity:1;transform:rotate(6deg);transition-delay:calc(var(--k)*70ms + .35s)}
.chipx.YT{background:#D45A50}.chipx.IG{background:#C2668F}
.dcard.done .thumb::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;background:rgba(95,174,139,.72)}
.deckhint{font-size:13px;color:var(--ink-3);text-align:center;margin:0}

/* 翻開筆記本（桌機雙頁時） */
.book{perspective:2000px}
@media (min-width:1080px) and (prefers-reduced-motion:no-preference){
  .book.opening .pagecard:last-child{transform-origin:left center;animation:bookopen 1s cubic-bezier(.2,.8,.2,1) both}
  .book.opening .rings i{animation:ringpop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.55s}
}
@keyframes bookopen{0%{transform:rotateY(-105deg);box-shadow:-30px 0 60px -20px rgba(0,0,0,.35);opacity:.6}60%{opacity:1}100%{transform:none}}
@keyframes ringpop{from{transform:scale(.4);opacity:0}}

/* 共享元素轉場（支援的瀏覽器才有） */
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(tasktitle){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 背景立體層 -->
<div class="scene" aria-hidden="true">
  <div class="layer" data-depth="18" style="left:4%;top:14%"><div class="cloud3d float" style="--w:200px"></div></div>
  <div class="layer" data-depth="34" style="right:6%;top:8%"><div class="cloud3d float b" style="--w:150px"></div></div>
  <div class="layer" data-depth="10" style="left:-30px;bottom:12%"><div class="vinyl spin"></div></div>
  <div class="layer" data-depth="44" style="right:3%;bottom:18%"><div class="orb float" style="--w:64px"></div></div>
  <div class="layer" data-depth="26" style="left:46%;top:3%"><div class="star float b"></div></div>
  <div class="layer" data-depth="22" style="right:22%;bottom:4%"><div class="cloud3d float" style="--w:120px"></div></div>
</div>

<!-- 共用黑貓 SVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="catFace" viewBox="0 0 64 64">
      <path d="M14 28 L12 8 L27 19 Z M50 28 L52 8 L37 19 Z" fill="#1C1C22"/>
      <ellipse cx="32" cy="35" rx="21" ry="19" fill="#1C1C22"/>
      <path d="M11 34 C11 10 53 10 53 34" stroke="#F4EEE3" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="6" y="29" width="9" height="14" rx="4.5" fill="#F4EEE3"/><rect x="49" y="29" width="9" height="14" rx="4.5" fill="#F4EEE3"/>
      <path d="M22 35 q4 3 8 0 M34 35 q4 3 8 0" stroke="#CFC8BD" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M30.5 39 h3 l-1.5 1.8z" fill="#C9A0A0"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <!-- 側邊欄（桌機） -->
  <aside class="side" aria-label="主選單">
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#9DB9D9"/><use href="#catFace" x="4" y="6" width="56" height="56"/></svg><b>Mellow Meow</b></div>
    <nav class="snav" id="snav">
      <span class="pill" id="spill" aria-hidden="true"></span>
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>總覽</a>

      <a href="#release" data-tab="release"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>發布</a>

<script src="data.js"></script>
<script>
(() => {
"use strict";
const D = window.MM_DATA;
if (!D) { document.body.innerHTML = '<p style="padding:24px">找不到 data.js，請確認它和 index.html 放在同一個資料夾。</p>'; return; }

/* ---------- 狀態 ---------- */
const KEY = "mellowmeow-ops-v1";
const blank = () => ({ tasks:{}, custom:[], notes:[], chat:[], settings:{ apiKey:"", model:"claude-sonnet-5-5", theme:"" } });
let S; try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = blank(); }
S.settings = Object.assign(blank().settings, S.settings || {});
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch(e){ toast("儲存失敗：瀏覽器空間滿了，試著刪掉幾張圖片"); return false; } }

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isDesk = () => innerWidth >= 960;

let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1900); }
async function copy(text, btn, label="已複製"){
  try { await navigator.clipboard.writeText(text); } catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(label); if (btn){ const o=btn.textContent; btn.classList.add("ok"); btn.textContent="✓ 已複製"; setTimeout(()=>{ btn.classList.remove("ok"); btn.textContent=o; },1400); }
}

/* ---------- 主題 ---------- */
function applyTheme(){
  const t = S.settings.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  $('meta[name="theme-color"]').content = t==="dark" ? "#121A2B" : "#CFE0F2";
}
$("#themeBtn").addEventListener("click", () => { S.settings.theme = document.documentElement.dataset.theme==="dark" ? "light" : "dark"; save(); applyTheme(); });

/* ---------- 任務資料 ---------- */
const phases = () => D.phases.map(p => ({ ...p, tasks:[...p.tasks, ...S.custom.filter(c=>c.phase===p.id).map(c=>({...c,custom:true}))] }));
const allTasks = () => phases().flatMap(p => p.tasks.map(t => ({...t, phase:p.id, phaseTitle:p.title, ongoing:!!p.ongoing})));
const st = t => { const s=S.tasks[t.id]; return { done: s && "done" in s ? s.done : !!t.done, note:(s&&s.note)||"" }; };
const setDone = (id,done) => { S.tasks[id]=Object.assign(S.tasks[id]||{}, {done}); save(); };
const setNote = (id,note) => { S.tasks[id]=Object.assign(S.tasks[id]||{}, {note}); save(); };
const roundTasks = () => allTasks().filter(t => !t.ongoing);

/* ---------- 共用元件 ---------- */
const CHECK = `<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>`;
function catSVG(id){ return `
<svg class="catsvg" id="${id}" viewBox="0 0 200 230" aria-hidden="true">
  <g class="tail"><path d="M150 214 C190 210 196 168 176 150" stroke="#1C1C22" stroke-width="15" fill="none" stroke-linecap="round"/></g>
  <path d="M58 226 C30 226 34 160 62 132 C76 120 124 120 138 132 C166 160 170 226 142 226 Z" fill="#1C1C22"/>
  <g class="head">
    <path d="M52 84 L50 30 L90 60 Z" fill="#1C1C22" stroke="#1C1C22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M148 84 L150 30 L110 60 Z" fill="#1C1C22" stroke="#1C1C22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M58 70 L58 44 L80 61 Z M142 70 L142 44 L120 61 Z" fill="#3A2F35"/>
    <ellipse cx="100" cy="96" rx="56" ry="50" fill="#1C1C22"/>
    <g class="phones">
      <path d="M40 96 C38 26 162 26 160 96" stroke="#F4EEE3" stroke-width="10" fill="none" stroke-linecap="round"/>
      <rect x="28" y="80" width="24" height="38" rx="12" fill="#F4EEE3"/><ellipse cx="44" cy="99" rx="6" ry="12" fill="#E6C9C4"/>
      <rect x="148" y="80" width="24" height="38" rx="12" fill="#F4EEE3"/><ellipse cx="156" cy="99" rx="6" ry="12" fill="#CFE2D8"/>
    </g>
    <g class="closed" stroke="#CFC8BD" stroke-width="3" fill="none" stroke-linecap="round"><path d="M70 98 Q80 106 90 98"/><path d="M110 98 Q120 106 130 98"/></g>
    <g class="open">
      <ellipse cx="80" cy="97" rx="11" ry="12" fill="#F2C84B"/><ellipse cx="120" cy="97" rx="11" ry="12" fill="#F2C84B"/>
      <circle class="pupil" cx="80" cy="97" r="5.5" fill="#1C1C22"/><circle class="pupil" cx="120" cy="97" r="5.5" fill="#1C1C22"/>
    </g>
    <g class="smile" stroke="#CFC8BD" stroke-width="3" fill="none" stroke-linecap="round"><path d="M70 101 Q80 90 90 101"/><path d="M110 101 Q120 90 130 101"/></g>
    <path d="M96 111 h8 l-4 5 z" fill="#C9A0A0"/>
    <path d="M92 119 q4 4 8 0 q4 4 8 0" stroke="#8F8790" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g stroke="#8F8790" stroke-width="1.4" stroke-linecap="round"><path d="M64 112 L40 108 M64 117 L42 120"/><path d="M136 112 L160 108 M136 117 L158 120"/></g>
  </g>
</svg>`; }

/* ---------- 頁首 ---------- */
function renderTop(page){
  const d = new Date(); const wd = "日一二三四五六"[d.getDay()]; const h = d.getHours();
  $("#today").textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日 星期${wd}`;
  const greet = h<11 ? "早安，今天也要撐住" : h<14 ? "午餐吃了嗎？" : h<18 ? "還沒下班，再一下下" : h<23 ? "下班了嗎？今天也辛苦了" : "這麼晚了，早點睡";
  const titles = { home:greet, tasks:"待辦清單", release:"發布計畫", brand:"品牌手冊", notes:"筆記" };
  $("#greet").textContent = titles[page];
  const left = roundTasks().filter(t=>!st(t).done).length;
  $("#sideCount").textContent = left || "";
}

/* ---------- 總覽 ---------- */
function viewHome(){
  const rt = roundTasks(); const left = rt.filter(t=>!st(t).done).length; const pct = Math.round((rt.length-left)/rt.length*100);
  const next = rt.find(t=>!st(t).done);
  const r = D.releases[0]; const days = r ? Math.ceil((new Date(r.date)-Date.now())/86400000) : 0;
  const ph = phases().filter(p=>p.id!=="done");
  const note = S.notes[0];
  return `
  <div class="grid home">
    <section class="card hero span-8 tilt">
      <div class="catwrap" id="heroCat" role="button" tabindex="0" aria-label="摸摸黑貓">${catSVG("cat1")}<span class="bubble" id="catBubble"></span></div>
      <div class="text">
        <span class="label"><i></i>這一輪的進度</span>
        <p class="big">${left ? `還差 <b>${left}</b> 件事<span class="br"></span>就能下班` : `全部做完，今天準時下班 🧋`}</p>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <small>已完成 ${pct}%（不含長期節奏）</small>
      </div>
      <span class="sill"></span>
    </section>

    <section class="card next span-4 tilt">
      <span class="label"><i></i>先做這件</span>
      ${next ? `<h3>${esc(next.title)}</h3><p>${esc(next.phaseTitle)}${next.tag?"・"+esc(next.tag):""}</p>
      <div class="row"><button class="btn" data-go="${next.id}">看步驟</button><button class="btn light" data-quickdone="${next.id}">已經做完</button></div>`
      : `<h3>清單清空了</h3><p>去筆記記一下這週的數據吧。</p>`}
    </section>

    ${r ? `<section class="card count span-4 tilt">
      <span class="disc" aria-hidden="true"></span>
      <span class="label">下一首</span>
      ${days>0 ? `<div class="n">${days}</div><p>天後首播〈${esc(r.title)}〉<br>${r.schedule.map(s=>esc(s.date)).join("、")}</p>` : `<div class="n" style="font-size:34px">已上線</div><p>〈${esc(r.title)}〉</p>`}
      <a class="btn small ghost" href="#release">看發布計畫</a>
    </section>` : ""}

    <section class="card span-4 tilt">
      <span class="label"><i></i>各階段</span>
      ${ph.map(p=>{ const n=p.tasks.length, d=p.tasks.filter(t=>st(t).done).length; return `<div class="pbar"><span>${esc(p.title)}</span><span class="t"><i style="width:${n?d/n*100:0}%"></i></span><span>${d}/${n}</span></div>`; }).join("")}
    </section>

    <section class="card span-4 tilt">
      <span class="label"><i></i>最近的筆記</span>
      ${note ? `<div class="npreview">${note.img?"🖼️ ":""}${esc(note.text.slice(0,90))}${note.text.length>90?"…":""}</div>` : `<p class="muted" style="margin:4px 0">還沒有筆記。上線一週後，把數據寫進來。</p>`}
      <div class="row" style="margin-top:12px"><a class="btn small ghost" href="#notes">打開筆記</a></div>
    </section>

    <section class="card span-12">
      <span class="label"><i></i>經營守則</span>
      <div class="rules">${D.rules.map((x,i)=>`<div class="rule"><b>${i+1}</b><span>${esc(x)}</span></div>`).join("")}</div>
    </section>
  </div>`;
}

/* ---------- 待辦 ---------- */
let filter = "todo"; let selected = null;
function viewTasks(){
  const list = phases().map(p=>{
    const items = p.tasks.filter(t => filter==="all" || (filter==="todo" ? !st(t).done : st(t).done));
    if (!items.length && (filter!=="todo" || p.id==="done")) return "";
    const n=p.tasks.length, d=p.tasks.filter(t=>st(t).done).length;
    return `<div class="phase"><div class="phase-h"><h3>${esc(p.title)}</h3><small>${esc(p.sub||"")}</small><span class="pc">${d}/${n}</span></div>
      <div class="tlist">${items.length ? items.map(t=>{ const s=st(t); return `<div class="titem ${s.done?"done":""} ${selected===t.id?"sel":""}" data-select="${t.id}">
        <button class="check" data-toggle="${t.id}" aria-pressed="${s.done}" aria-label="${s.done?"改回未完成":"標記完成"}：${esc(t.title)}">${CHECK}</button>
        <span class="tt">${esc(t.title)}</span>${s.note?`<span class="tag note">筆記</span>`:""}${t.tag?`<span class="tag">${esc(t.tag)}</span>`:""}</div>`; }).join("") : `<p class="muted" style="padding:10px 14px;margin:0">這一段都做完了 ✓</p>`}
      ${p.id!=="done" ? `<form class="addrow" data-add="${p.id}"><input placeholder="加一件事…" aria-label="在${esc(p.title)}新增"><button class="btn small ghost">加入</button></form>` : ""}</div></div>`;
  }).join("") || `<p class="empty">這裡空空的，換個篩選看看。</p>`;
  return `<p class="page-sub">點一項看步驟和寫筆記，點方框直接打勾。</p>
  <div class="chips" role="group" aria-label="篩選">
    ${[["todo","還沒做"],["all","全部"],["done","做完了"]].map(([k,v])=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join("")}
  </div>
  <div class="tasks-wrap"><div>${list}</div>${isDesk() ? `<div class="detail" id="detailPane">${detailHTML(selected)}</div>` : ""}</div>`;
}
function detailHTML(id){
  const t = id && allTasks().find(x=>x.id===id);
  if (!t) return `<div class="card emptyd">${catSVG("cat2")}<p>選一項待辦，<br>步驟和筆記會出現在這裡。</p></div>`;
  const s = st(t);
  return `<div class="card">
    <span class="label"><i></i>${esc(t.phaseTitle)}${t.tag?"・"+esc(t.tag):""}</span>
    <h2>${esc(t.title)}</h2>
    ${t.detail?`<p class="muted" style="margin:0;word-break:break-word">${linkify(t.detail)}</p>`:""}
    ${t.steps?`<ol class="steps">${t.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    <label class="label" for="note-${t.id}" style="margin-top:14px"><i></i>我的筆記</label>
    <textarea class="ruled" id="note-${t.id}" data-note="${t.id}" placeholder="寫點備註…">${esc(s.note)}</textarea>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <span class="saved" data-saved="${t.id}"></span>
      <span class="row">${t.custom?`<button class="btn small ghost" data-del="${t.id}">刪除</button>`:""}
      <button class="btn small ${s.done?"ghost":"accent"}" data-toggle="${t.id}">${s.done?"改回未完成":"標記完成"}</button></span>
    </div>
  </div>`;
}

/* ---------- 發布 ---------- */
const copyStore = {};
function cblock(label, text, platform, key){
  copyStore[key]=text; const long = text.split("\n").length > 7;
  const pc = platform ? platform.replace(":","").replace(/^9/,"p9") : "";
  return `<div class="cblock"><div class="cb-h"><strong>${platform?`<span class="plat ${esc(pc)}">${esc(platform)}</span>`:""}<span>${esc(label)}</span></strong><button class="btn small copy" data-copy="${key}">複製</button></div>
  <pre class="ct ${long?"clamp":""}" id="pre-${key}">${esc(text)}</pre>${long?`<button class="linkbtn" data-expand="${key}">展開全文</button>`:""}</div>`;
}
function deckHTML(r){
  const items = r.schedule.flatMap((s,si)=>s.items.map(it=>({...it, when:s.date, wave:si})));
  const n = items.length, mid = (n-1)/2;

function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const max=900, k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.78)); }; im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

function reveal(el){
  if(!el || reduce) return; let i=0;
  const walk = node => { [...node.childNodes].forEach(c=>{
    if(c.nodeType===3){ const frag=document.createDocumentFragment(); Array.from(c.textContent).forEach(chr=>{ const s=document.createElement("span"); s.className="ch"; s.style.setProperty("--i",i++); s.textContent=chr; frag.appendChild(s); }); c.replaceWith(frag); }
    else if(c.nodeType===1 && c.tagName==="B"){ c.classList.add("ch"); c.style.setProperty("--i",i++); i+=2; }
    else if(c.nodeType===1 && !c.classList.contains("br")) walk(c);
  }); };
  walk(el); el.classList.add("reveal"); el.setAttribute("aria-label", el.textContent);
}

    io.observe(d);
  });
}

    const b=$("#catBubble"); b.textContent=LINES[Math.floor(Math.random()*LINES.length)]; b.classList.add("show");

function lookAt(x,y){
  $$(".catsvg").forEach(svg => {
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*.42; const dx=x-cx, dy=y-cy; const dist=Math.hypot(dx,dy);
    const ang=Math.max(-10,Math.min(10,dx/40)); const head=svg.querySelector(".head"); if(head) head.style.transform=`rotate(${ang}deg) translateY(${Math.max(-4,Math.min(4,dy/80))}px)`;
    const k=Math.min(1,dist/240); const px=(dx/(dist||1))*4.2*k, py=(dy/(dist||1))*4.2*k;
    svg.querySelectorAll(".pupil").forEach(p=>p.style.transform=`translate(${px}px,${py}px)`);
    if (dist < Math.max(320, r.width*1.8)) svg.classList.add("awake");
  });
  clearTimeout(sleepT); sleepT=setTimeout(()=>$$(".catsvg").forEach(s=>s.classList.remove("awake")),2500);
}

/* ---------- 完成時的小雲朵 ---------- */
function burst(el){
  if (reduce || !el) return; const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for (let i=0;i<10;i++){ const s=document.createElement("span"); s.className="burst"; const a=Math.PI*2*i/10, d=26+Math.random()*22;
    s.style.left=cx+"px"; s.style.top=cy+"px"; s.style.background = i%3? "var(--accent)" : (i%2? "var(--sky)":"#fff");
    document.body.appendChild(s);
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:620,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>s.remove(); }
}

  const L=[]; if(forPaste) L.push("這是我 Mellow Meow 頻道專案網站的目前進度，請根據它幫我：（在這裡寫你想問的事）","");
  L.push(`資料版本：${D.version}`);
  phases().forEach(p=>{ L.push(`\n【${p.title}】${p.sub||""}`); p.tasks.forEach(t=>{ const s=st(t); L.push(`${s.done?"✅":"⬜"} [${t.id}] ${t.title}${s.note?`（筆記：${s.note.replace(/\n/g," ")}）`:""}`); }); });
  if(S.notes.length){ L.push("\n【筆記】"); S.notes.slice(0,15).forEach(n=>L.push(`- ${new Date(n.t).toLocaleDateString("zh-TW")}：${(n.text||"").replace(/\n/g," ")}${n.img?"（附圖）":""}${n.link?`（連結：${n.link}）`:""}`)); }
  return L.join("\n");
}

/* ---------- 問 Claude ---------- */
const QUICK=["我今天只有 30 分鐘，先做什麼？","幫我想 3 句這週短片的字卡","幫我把挑好的「一句話」變成歌詞方向","看我的筆記，數據有什麼問題？"];
function renderChat(){
  $("#quickAsks").innerHTML = QUICK.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("");
  const body=$("#chatBody");
  if(!S.settings.apiKey){
    body.innerHTML=`<div class="msg ai">還沒設定 API 金鑰，所以沒辦法直接在這裡對話。

兩種用法：
1. 按「複製進度摘要」，貼到 Claude App 問，Claude 會照你的進度回答。上面的快速問題按下去，也會連同問題一起複製。
2. 到設定填自己的 API 金鑰（費用另計），之後就能在這裡聊，Claude 也能幫你新增待辦、勾選、寫筆記。</div>
    <div class="row"><button class="btn small" id="cSum">複製進度摘要</button><button class="btn small ghost" id="cSet">設定金鑰</button></div>`;
    $("#cSum").onclick=()=>copy(summary(true),null,"摘要已複製，貼到 Claude 就好");
    $("#cSet").onclick=()=>{ closeDrawers(); setTimeout(()=>$("#openSettings").click(),250); };
    return;
  }
  body.innerHTML = S.chat.length ? S.chat.map(msgHTML).join("") : `<div class="msg ai">嗨，今天也辛苦了。想先處理哪一件？我看得到你的待辦和筆記。</div>`;
  body.scrollTop=body.scrollHeight;
}
function parseActions(text){ const m=text.match(/```mm-actions\s*([\s\S]*?)```/); if(!m) return {clean:text,actions:null}; let a=null; try{ a=JSON.parse(m[1]); if(!Array.isArray(a)) a=null; }catch(e){} return {clean:text.replace(m[0],"").trim(),actions:a}; }
function describe(a){ const t=a.id&&allTasks().find(x=>x.id===a.id);
  if(a.type==="add_task") return `新增待辦到「${(D.phases.find(p=>p.id===a.phase)||{}).title||a.phase}」：${a.title}`;
  if(a.type==="set_done") return `${a.done?"勾選完成":"改回未完成"}：${t?t.title:a.id}`;
  if(a.type==="set_note") return `寫筆記到「${t?t.title:a.id}」：${a.note}`;
  if(a.type==="add_note") return `新增便利貼：${a.text}`; return "（看不懂的變更，會略過）"; }
function msgHTML(m,i){
  if(m.role==="user") return `<div class="msg user">${esc(m.content)}</div>`;
  if(m.role==="error") return `<div class="msg err">${esc(m.content)}</div>`;
  const {clean,actions}=parseActions(m.content);
  return `<div class="msg ai">${esc(clean)}${actions&&actions.length?`<div class="acts"><strong>Claude 建議這些變更：</strong><ul>${actions.map(a=>`<li>${esc(describe(a))}</li>`).join("")}</ul>${m.applied?`<span class="muted">已套用 ✓</span>`:`<button class="btn small accent" data-apply="${i}">套用變更</button>`}</div>`:""}</div>`;
}
function applyActions(i){ const m=S.chat[i]; if(!m||m.applied) return; const {actions}=parseActions(m.content); if(!actions) return;
  actions.forEach(a=>{ if(a.type==="add_task"&&a.title&&D.phases.some(p=>p.id===a.phase)) S.custom.push({id:uid(),phase:a.phase,title:String(a.title),detail:a.detail?String(a.detail):undefined});
    else if(a.type==="set_done"&&a.id) setDone(a.id,!!a.done); else if(a.type==="set_note"&&a.id) setNote(a.id,String(a.note||""));
    else if(a.type==="add_note"&&a.text) S.notes.unshift({id:uid(),text:String(a.text),t:Date.now()}); });
  m.applied=true; save(); render(false); renderChat(); toast("變更套用了"); }
function systemPrompt(){ return `你是小R的頻道經營夥伴，協助經營 YouTube／Instagram 頻道「Mellow Meow｜下班後的小陪伴」（原創 lo-fi，角色是戴奶油色耳機的黑貓）。小R 是普通上班族，時間有限。用繁體中文、口語、簡短回答，給馬上能做的事。

經營守則：
${D.rules.map(r=>"- "+r).join("\n")}

文案語氣：${D.brand.voice.summary}
要：${D.brand.voice.do.join("；")}
不要：${D.brand.voice.dont.join("；")}

目前進度：
${summary(false)}

如果要修改網站上的進度，在回答最後加一個區塊（小R 按按鈕確認才會套用）：
\`\`\`mm-actions
[{"type":"add_task","phase":"B","title":"…","detail":"…"},{"type":"set_done","id":"b1","done":true},{"type":"set_note","id":"b2","note":"…"},{"type":"add_note","text":"…"}]
\`\`\`
phase 只能是 ${D.phases.filter(p=>p.id!=="done").map(p=>p.id+"（"+p.title+"）").join("、")}。沒有要改就不要加。`; }
let busy=false;
async function send(text){
  text=(text||"").trim(); if(!text||busy) return; if(!S.settings.apiKey){ renderChat(); return; }
  busy=true; $("#sendChat").disabled=true; S.chat.push({role:"user",content:text}); save(); renderChat();
  const body=$("#chatBody"); const ty=document.createElement("div"); ty.className="msg ai"; ty.textContent="想一下…"; body.appendChild(ty); body.scrollTop=body.scrollHeight;
  try{
    const history=S.chat.filter(m=>m.role==="user"||m.role==="assistant").slice(-12).map(m=>({role:m.role,content:m.content}));
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.settings.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:S.settings.model||"claude-sonnet-5-5",max_tokens:1500,system:systemPrompt(),messages:history})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok){ const why=res.status===401?"API 金鑰不正確，請到設定重新貼上。":res.status===404?"找不到這個模型名稱，請到設定確認模型。":res.status===429?"請求太頻繁或額度用完了，等一下再試，或到 Anthropic Console 檢查額度。":`連線失敗（${res.status}）：${(j.error&&j.error.message)||"請稍後再試"}`; S.chat.push({role:"error",content:why}); }
    else S.chat.push({role:"assistant",content:(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n").trim()||"（沒有收到回覆內容）"});
  }catch(err){ S.chat.push({role:"error",content:"網路連線失敗，請確認網路後再試一次。"}); }
  save(); busy=false; $("#sendChat").disabled=false; renderChat();
}
$("#sendChat").addEventListener("click",()=>{ const v=$("#chatInput").value; $("#chatInput").value=""; send(v); });
$("#chatInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("#sendChat").click(); } });
$("#chatInput").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"; });

applyTheme(); { const h=location.hash.slice(1); page = PAGES[h] ? h : "home"; paint(true); }
})();
</script>
